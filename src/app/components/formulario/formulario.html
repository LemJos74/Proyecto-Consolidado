<section id="formulario" class="container my-5">

  <div class="text-center mb-4">
    <h2 class="fw-bold">Déjanos tu opinión</h2>
    <p class="text-secondary">
      Comparte tu experiencia con TecnoMax
    </p>
  </div>

  <div class="col-12 col-md-6 mx-auto">

    <form
      (ngSubmit)="agregarResena()"
      class="card shadow-sm p-4"
    >

      <div class="mb-3">
        <label for="nombre" class="form-label">
          Nombre
        </label>

        <input
          id="nombre"
          type="text"
          class="form-control"
          name="nombre"
          [(ngModel)]="nombre"
          required
        >
      </div>

      <div class="mb-3">
        <label for="comentario" class="form-label">
          Comentario
        </label>

        <textarea
          id="comentario"
          class="form-control"
          name="comentario"
          rows="4"
          [(ngModel)]="comentario"
          required
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary">
        Enviar reseña
      </button>

    </form>

  </div>

  <div class="mt-5">

    <h3 class="h4 mb-3">
      Reseñas registradas
    </h3>

    <div
      class="card mb-3"
      *ngFor="let resena of resenas()"
    >
      <div class="card-body">

        <h4 class="h6 fw-bold">
          {{ resena.nombre }}
        </h4>

        <p class="mb-0 text-secondary">
          {{ resena.comentario }}
        </p>

      </div>
    </div>

  </div>

</section>
